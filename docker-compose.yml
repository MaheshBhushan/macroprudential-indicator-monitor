name: macroprudential-mim
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mim
      POSTGRES_PASSWORD: mim
      POSTGRES_DB: mim
    ports:
      - "127.0.0.1:55473:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mim -d mim"]
      interval: 2s
      timeout: 3s
      retries: 30
