[project]
name = "macroprudential-indicator-monitor"
version = "0.1.0"
description = "Ingest BIS, ECB and Eurostat macroprudential series into PostgreSQL with vintages, quality flags and indicator views."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
tableau = ["tableauhyperapi>=0.0.21000", "tableaudocumentapi>=0.11", "setuptools>=70"]  # docapi imports distutils

[project.scripts]
mim = "mim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
